name: Java CI + Docker Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: data-governance-backend
        run: mvn -B clean package -DskipTests

      - name: Build Docker image
        working-directory: data-governance-backend
        run: docker build -t data-governance-backend:latest .
