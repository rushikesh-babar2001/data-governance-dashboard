name: Java CI + Docker Build + Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------- BACKEND ----------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend with Maven
        working-directory: data-governance-backend
        run: mvn -B clean package -DskipTests

      # ---------------- DOCKER LOGIN ----------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------- BACKEND IMAGE ----------------

      - name: Build Backend Docker Image
        working-directory: data-governance-backend
        run: docker build -t rushikeshbabar09/data-governance-backend:latest .

      - name: Push Backend Docker Image
        run: docker push rushikeshbabar09/data-governance-backend:latest

      # ---------------- FRONTEND IMAGE ----------------

      - name: Build Frontend Docker Image
        working-directory: data-governance-frontend
        run: docker build -t rushikeshbabar09/data-governance-frontend:latest .

      - name: Push Frontend Docker Image
        run: docker push rushikeshbabar09/data-governance-frontend:latest
