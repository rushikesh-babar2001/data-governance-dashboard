name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Spring Boot application
        run: ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/data-governance-backend:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/data-governance-backend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/data-governance-backend:latest
            docker rm -f data-governance-backend-container || true
            docker run -d \
              --name data-governance-backend-container \
              --network data-governance-network \
              --restart unless-stopped \
              -p 8080:8080 \
              -e MYSQLHOST=data-governance-mysql-container \
              -e MYSQLPORT=3306 \
              -e MYSQLDATABASE=data_governance \
              -e MYSQLUSER=root \
              -e MYSQLPASSWORD=root \
              ${{ secrets.DOCKERHUB_USERNAME }}/data-governance-backend:latest